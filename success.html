<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grazie — LumaCore Digital Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
            --dark: #0f172a;
            --gray-500: #64748b;
            --gray-100: #f1f5f9;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-100);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { text-align: center; padding: 40px; max-width: 600px; }
        .checkmark {
            width: 80px; height: 80px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 32px;
            font-size: 40px; color: white;
        }
        h1 { font-size: 2rem; color: var(--dark); margin-bottom: 16px; }
        p { color: var(--gray-500); font-size: 1.1rem; line-height: 1.6; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            background: var(--gradient);
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Messaggio Inviato!</h1>
        <p>Grazie per averci contattato! Ti risponderemo entro 24 ore. Nel frattempo, puoi scriverci direttamente su WhatsApp.</p>
        <a href="https://wa.me/393780910756?text=Ciao%20ho%20compilato%20il%20form%20sul%20sito" class="btn">Scrivici su WhatsApp →</a>
    </div>
</body>
</html>
